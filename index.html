<script type="module">

const DICT = {

    hint_gesture: "<span>🖐️ 挥手↔:切模型</span><span>🖐️ 挥手↕:切状态</span><span>🤏 捏合拖拽:旋转/爆破</span><span>🙌 双手拉伸:缩放</span>",
    err: "异常: "
  },
  en: {
    btn_zh: "中文", btn_en: "EN", btn_particle: "Particle", btn_solid: "Solid", btn_ui_hide: "Hide UI", btn_ui_show: "Show UI",
    btn_mouse: "🖱️ Mouse / Gesture", btn_gesture: "✋ Mouse / Gesture", loading_ai: "⏳ Starting AI...", loading_err: "Cam/AI Error",
    btn_music_on: "🎵 Play BGM", btn_music_off: "⏸️ Pause BGM",
    loading_data: "Loading Coordinates", loading_model: "Downloading Model",
    integ: "Integrity", craft: "Craft", hist: "History", usage: "Usage", type: "Type", decoration: "Pattern",
    hint_mouse: "<span>Scroll:Zoom</span><span>Drag:Rotate</span><span>Hover:Inner Dissolve</span><span>Click:Burst</span><span>Space:Switch</span>", 
    hint_gesture: "<span>🖐️ Swipe↔:Switch</span><span>🖐️ Swipe↕:State</span><span>🤏 Pinch+Drag:Rotate/Burst</span><span>🙌 2-Hands:Zoom</span>",
    err: "Error: "

// Keep assets on the same GitHub Pages origin for reliable loading.
const BASE = './';
const MODEL_URLS = [
  BASE + '/public/models/wu-wang-zheng-shang-gui.glb',
  BASE + '/public/models/zeng-hou-yi-bian-zhong.glb',
  BASE + '/public/models/erlitou-jue.glb',
  BASE + '/public/models/hou-si-mu-wu-ding.glb',
  BASE + '/public/models/si-yang-fang-zun.glb',
];
const JSON_URL = BASE + '/public/data/introduce.json';

// Adapt the particle budget to the device so the desktop experience stays rich

const WIDTH = PARTICLE_WIDTH;
const COUNT = PARTICLE_COUNT;
const REF_DIST = 8.0;
const PARTICLE_CACHE_VERSION = 'v2';
const MODEL_CACHE_LIMIT = 3;

let artifacts = []; 
let modelTargets = new Array(MODEL_URLS.length).fill(null); 
let solidModels = new Array(MODEL_URLS.length).fill(null);
let currentIndex = 0; let prevIndex = 0; 
let transition = 1; let explosion = 0;

let viewMode = 'particle';

let targetStateBlend = 0.0;

const modelLoading = new Map();
const modelLastUsed = new Map();

let autoRotateAngle = 0; let userRotX = 0; let userRotY = 0;
let animationStarted = false;
let isDragging = false; let hasDragged = false; let lastX = 0; let lastY = 0;

const mouse = new THREE.Vector2(9999, 9999);
const prevMousePos = new THREE.Vector3(9999, 9999, 0);
const currentMousePos = new THREE.Vector3(9999, 9999, 0);

let mouseForceActive = 0.0;

const bgMusic = document.getElementById('bg-music');
bgMusic.volume = 0.5;

function setAssetStatus(message, state = '') {
  const el = document.getElementById('asset-status');
  if (!el || message === lastAssetStatus) return;
  lastAssetStatus = message;
  el.textContent = message;
  el.className = state;
}

function ensureMusicSource() {

    bgMusic.src = MUSIC_URL;

  }
}

function updateUI(i) {
  const d = DICT[lang]; const a = artifacts[i] || {};
  const t = (o) => (o && o[lang]) ? o[lang] : (o && o.zh ? o.zh : '—');
  
  document.getElementById('btn-zh').textContent = d.btn_zh; 
  document.getElementById('btn-en').textContent = d.btn_en;
  document.getElementById('btn-particle').textContent = d.btn_particle; 
  document.getElementById('btn-solid').textContent = d.btn_solid;
  document.getElementById('btn-ui').textContent = uiVisible ? d.btn_ui_hide : d.btn_ui_show;
  document.getElementById('btn-music').textContent = musicPlaying ? d.btn_music_off : d.btn_music_on;
  
  // 严格基于 isAILoading 锁和当前 inputMode 渲染文字，避免状态死锁

  } else {

  document.getElementById('hint').innerHTML = inputMode === 'mouse' ? d.hint_mouse : d.hint_gesture;

document.getElementById('btn-en').onclick = () => { lang = 'en'; updateUI(currentIndex); updateBtnStates(); };

};
document.getElementById('btn-solid').onclick = () => { setViewMode('solid'); };

document.getElementById('btn-ui').onclick = () => {
  uiVisible = !uiVisible;
  document.getElementById('ui-layer').style.opacity = uiVisible ? '1' : '0';
  document.getElementById('btn-ui').textContent = uiVisible ? DICT[lang].btn_ui_hide : DICT[lang].btn_ui_show;
};

// ============================================================
// Robust Audio Playback Handling
// ============================================================
document.getElementById('btn-music').onclick = () => {
  if (musicPlaying) {
    bgMusic.pause();
    musicPlaying = false;
    updateUI(currentIndex);
    updateBtnStates();
  } else {
    ensureMusicSource();
    bgMusic.play().then(() => {
      musicPlaying = true;
      updateUI(currentIndex);
      updateBtnStates();
    }).catch(e => {
      console.warn("Audio play failed:", e);
      musicPlaying = false;
      updateUI(currentIndex);
      updateBtnStates();
    });
  }
};

function updateBtnStates() {
  document.getElementById('btn-zh').className = lang === 'zh' ? 'active' : '';
  document.getElementById('btn-en').className = lang === 'en' ? 'active' : '';
  document.getElementById('btn-particle').className = viewMode === 'particle' ? 'active' : '';
  document.getElementById('btn-solid').className = viewMode === 'solid' ? 'active' : '';
  document.getElementById('btn-input').className = inputMode === 'gesture' ? 'active' : '';
  document.getElementById('btn-music').className = musicPlaying ? 'active' : '';
}
function setLoading(t) { const el = document.getElementById('loading-text'); if (el) el.textContent = t; }
function hideLoading() { const c = document.getElementById('loading-container'); c.style.opacity = '0'; setTimeout(() => {c.style.visibility = 'hidden'; c.style.display = 'none';}, 600); }
function showErr(msg) { 
  const errEl = document.getElementById('err'); 
  errEl.style.display = 'block'; 
  errEl.textContent = msg; 
  setAssetStatus(msg, 'error');
  setTimeout(() => errEl.style.display = 'none', 4000);
}

// ============================================================
// MediaPipe Hand Tracking (Safe Sync Load + Catch Release)
// ============================================================
let handLandmarker = null;
let webcamRunning = false;
let lastVideoTime = -1;
const video = document.getElementById("webcam");
const handCanvas = document.getElementById("hand-canvas");
const ctx = handCanvas.getContext("2d");

let gestureCooldown = 0; 
let indexHistory = []; 
let isPinching = false; let pinchStartTime = 0; let lastTwoHandDist = -1;

const MEDIAPIPE_SOURCES = [
  {
    bundle: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs',
    wasm: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm'
  },
  {
    bundle: 'https://unpkg.com/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs',
    wasm: 'https://unpkg.com/@mediapipe/tasks-vision@0.10.3/wasm'
  }
];
const MEDIAPIPE_MODEL_URLS = [
  'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
  'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/int8/1/hand_landmarker.task'
];

async function createHandLandmarker() {
  let lastError = null;
  for (const source of MEDIAPIPE_SOURCES) {
    try {
      setAssetStatus('Loading hand interaction engine…');
      const vision = await import(source.bundle);
      const visionResolver = await vision.FilesetResolver.forVisionTasks(source.wasm);
      for (const modelAssetPath of MEDIAPIPE_MODEL_URLS) {
        try {
          return await vision.HandLandmarker.createFromOptions(visionResolver, {
            baseOptions: { modelAssetPath, delegate: 'GPU' },
            runningMode: 'VIDEO', numHands: 2
          });
        } catch (error) {
          lastError = error;
        }
      }
    } catch (error) {
      lastError = error;
    }
  }
  throw lastError || new Error('MediaPipe resources are unavailable');
}

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8], [5,9],[9,10],[10,11],[11,12], 
  [9,13],[13,14],[14,15],[15,16], [13,17],[0,17],[17,18],[18,19],[19,20]
];

document.getElementById('btn-input').onclick = async () => {
  const btn = document.getElementById('btn-input');
  
  if (inputMode === 'mouse') {
    isAILoading = true;
    updateUI(currentIndex); // 触发变为 Loading 文本
    btn.style.pointerEvents = 'none'; // 防抖锁定
    
    try {
      if (!handLandmarker) {
        handLandmarker = await createHandLandmarker();
      }
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('This browser does not support camera access');
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
      video.srcObject = stream;
      video.onloadeddata = () => { 
        webcamRunning = true; 
        document.getElementById('cam-container').style.display = 'block'; 
        setAssetStatus('Hand interaction ready', 'ready');
      };
      inputMode = 'gesture';
    } catch (e) {
      showErr(DICT[lang].loading_err + ": " + e.message);
      inputMode = 'mouse'; // 退回鼠标模式
    } finally {
      // 无论成功还是失败，必须释放锁
      isAILoading = false;
      btn.style.pointerEvents = 'auto';
      updateUI(currentIndex); // 强制刷回正确按钮文本
      updateBtnStates();
    }
  } else {
    // 退出手势模式
    inputMode = 'mouse'; webcamRunning = false;
    document.getElementById('cam-container').style.display = 'none';
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    ctx.clearRect(0, 0, handCanvas.width, handCanvas.height);
    setAssetStatus('Mouse interaction active', 'ready');
    updateUI(currentIndex); updateBtnStates();
  }
};

function drawHands(landmarksArr, currentlyPinching) {
    handCanvas.width = handCanvas.clientWidth;
    handCanvas.height = handCanvas.clientHeight;
    ctx.clearRect(0,0, handCanvas.width, handCanvas.height);
    
    for(let hand of landmarksArr) {
        ctx.strokeStyle = currentlyPinching ? "rgba(255,50,50,0.8)" : "rgba(216,181,106, 0.8)";
        ctx.lineWidth = 2.5;
        for(let [i, j] of HAND_CONNECTIONS) {
            ctx.beginPath();
            ctx.moveTo(hand[i].x * handCanvas.width, hand[i].y * handCanvas.height);
            ctx.lineTo(hand[j].x * handCanvas.width, hand[j].y * handCanvas.height);
            ctx.stroke();
        }
        ctx.fillStyle = "#ffffff";
        for(let lm of hand) {
            ctx.beginPath();
            ctx.arc(lm.x * handCanvas.width, lm.y * handCanvas.height, 3, 0, Math.PI*2);
            ctx.fill();
        }
    }
}

function processHands(t, dt) {
  if (!webcamRunning || !handLandmarker) return;
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    let results;
    try {
      results = handLandmarker.detectForVideo(video, performance.now());
    } catch (e) {
      webcamRunning = false;
      showErr(DICT[lang].loading_err + ': ' + e.message);
      return;
    }
    
    if (results.landmarks && results.landmarks.length > 0) {
      const hand1 = results.landmarks[0];
      let indexTip = hand1[8];
      let thumb = hand1[4];
      
      let nx = 1.0 - indexTip.x; let ny = indexTip.y;
      mouse.x = nx * 2 - 1; mouse.y = -(ny * 2 - 1);
      mouseForceActive = 1.0;
      
      let pinchDist = Math.hypot(thumb.x - indexTip.x, thumb.y - indexTip.y);
      let currentlyPinching = pinchDist < 0.06;
      drawHands(results.landmarks, currentlyPinching);
      
      indexHistory.push({x: nx, y: ny, time: t});
      indexHistory = indexHistory.filter(p => t - p.time < 0.4); 
      
      if (gestureCooldown > 0) { 
          gestureCooldown -= dt; 
      } else if (indexHistory.length > 5 && !currentlyPinching) { 
          let old = indexHistory[0], cur = indexHistory[indexHistory.length - 1];
          let dtTime = cur.time - old.time;
          let dx = cur.x - old.x;
          let dy = cur.y - old.y;
          
          if (dtTime > 0.1 && dtTime < 0.4) {
              let speedX = Math.abs(dx) / dtTime;
              let speedY = Math.abs(dy) / dtTime;
              
              if (speedX > 1.2 && Math.abs(dx) > 0.18) {
                  switchTo((currentIndex + 1) % MODEL_URLS.length);
                  gestureCooldown = 1.0; indexHistory = [];
              } 
              else if (speedY > 1.2) {
                  setViewMode(viewMode === 'particle' ? 'solid' : 'particle');
                  gestureCooldown = 1.0; indexHistory = [];
              }
          }
      }
      
      if (currentlyPinching && !isPinching) {
          isPinching = true; isDragging = true; hasDragged = false;
          lastX = nx * innerWidth; lastY = ny * innerHeight; pinchStartTime = t;
      } else if (currentlyPinching && isPinching) {
          hasDragged = true;
          let curPx = nx * innerWidth, curPy = ny * innerHeight;
          userRotY += (curPx - lastX) * 0.006; userRotX += (curPy - lastY) * 0.006;
          userRotX = Math.max(-0.8, Math.min(0.8, userRotX));
          lastX = curPx; lastY = curPy;
      } else if (!currentlyPinching && isPinching) {
          isPinching = false; isDragging = false;
          if (!hasDragged && (t - pinchStartTime < 0.3)) explosion = 1.0;
      }
      
      if (results.landmarks.length > 1) {
          let hand2 = results.landmarks[1];
          let dist = Math.hypot(hand1[0].x - hand2[0].x, hand1[0].y - hand2[0].y);
          if (lastTwoHandDist > 0) {
              camera.position.z -= (dist - lastTwoHandDist) * 18.0; 
              camera.position.z = Math.max(4.5, Math.min(18, camera.position.z));
          }
          lastTwoHandDist = dist;
      } else { lastTwoHandDist = -1; }
      
    } else {
      mouseForceActive = 0.0; isDragging = false; isPinching = false; lastTwoHandDist = -1;
      ctx.clearRect(0,0, handCanvas.width, handCanvas.height); 
    }
  }
}

// Process Model & Inner Dissolve Shader
// ============================================================
function processModel(model, count, cachedPositions = null) {
  model.updateMatrixWorld(true);
  const tris = [];
  model.traverse(obj => {
    if (!obj.isMesh || !obj.geometry) return;
    const g = obj.geometry; const posAttr = g.attributes.position; if (!posAttr) return;
    const mat4 = obj.matrixWorld; const v = new THREE.Vector3(); const local = [];
    for (let i = 0; i < posAttr.count; i++) { v.fromBufferAttribute(posAttr, i).applyMatrix4(mat4); local.push(v.clone()); }
    const idx = g.index;
    if (idx) { for (let i = 0; i < idx.count; i += 3) { tris.push({ p: [local[idx.getX(i)], local[idx.getX(i+1)], local[idx.getX(i+2)]] }); } } 
    else { for (let i = 0; i+2 < posAttr.count; i += 3) { tris.push({ p: [local[i], local[i+1], local[i+2]] }); } }
  });

  const cumulativeAreas = new Float64Array(tris.length); 
  let totalArea = 0;
  const tA = new THREE.Vector3(), tB = new THREE.Vector3(), tC = new THREE.Vector3();
  for (let i = 0; i < tris.length; i++) {
    tA.subVectors(tris[i].p[1], tris[i].p[0]); tB.subVectors(tris[i].p[2], tris[i].p[0]);
    tC.crossVectors(tA, tB); totalArea += tC.length() * 0.5; cumulativeAreas[i] = totalArea; 
  }
  const box = new THREE.Box3(); tris.forEach(t => t.p.forEach(p => box.expandByPoint(p)));
  const center = box.getCenter(new THREE.Vector3()); const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1; const scale = 3.5 / maxDim;

  const positions = cachedPositions && cachedPositions.length === count * 3 ? cachedPositions : new Float32Array(count * 3);
  if (!cachedPositions) {
    if (!tris.length || totalArea <= 0) throw new Error('Model has no renderable triangles');
    for (let i = 0; i < count; i++) {
      let r = Math.random() * totalArea;
      let low = 0, high = tris.length - 1;
      while (low < high) { let mid = (low + high) >> 1; if (r <= cumulativeAreas[mid]) high = mid; else low = mid + 1; }
      let ti = low;
      let u = Math.random(), v = Math.random(); if (u + v > 1) { u = 1 - u; v = 1 - v; }
      const w = 1 - u - v;
      const p = new THREE.Vector3().copy(tris[ti].p[0]).multiplyScalar(w).addScaledVector(tris[ti].p[1], u).addScaledVector(tris[ti].p[2], v);
      p.sub(center).multiplyScalar(scale);
      positions[i*3] = p.x; positions[i*3+1] = p.y; positions[i*3+2] = p.z;
    }
  }

  const solidWrapper = new THREE.Group();
  const clonedScene = model.clone();
  clonedScene.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
  clonedScene.scale.setScalar(scale);
  
  clonedScene.traverse(child => {
    if (child.isMesh && child.material) {
      child.material = child.material.clone();
      child.material.transparent = true; 
      child.material.envMapIntensity = 1.2; 
      
      child.material.onBeforeCompile = (shader) => {
        shader.uniforms.uMousePos = { value: new THREE.Vector3(9999,9999,9999) };
        shader.uniforms.uLeakRadius = { value: 0.0 };
        shader.uniforms.uStateBlend = { value: 0.0 }; 
        shader.uniforms.uTransitionAlpha = { value: 1.0 }; 
        child.material.userData.shader = shader; 

        shader.vertexShader = `varying vec3 vWorldPos_custom; \n ${shader.vertexShader}`.replace(
          `#include <worldpos_vertex>`,
          `#include <worldpos_vertex> \n vWorldPos_custom = (modelMatrix * vec4(transformed, 1.0)).xyz;`
        );

        shader.fragmentShader = `
          uniform vec3 uMousePos; uniform float uLeakRadius; 
          uniform float uStateBlend; uniform float uTransitionAlpha; 
          varying vec3 vWorldPos_custom;
          ${shader.fragmentShader}
        `.replace(
          `#include <dithering_fragment>`,
          `#include <dithering_fragment>
           
           gl_FragColor.a *= uStateBlend * uTransitionAlpha; 

           if (uLeakRadius > 0.0 && uStateBlend > 0.1) {
             float dist = length(vWorldPos_custom - uMousePos);
             if (dist < uLeakRadius) {
               float innerRadius = uLeakRadius * 0.8;
               if (dist < innerRadius) {
                 discard; 
               } else {
                 float t = (dist - innerRadius) / (uLeakRadius - innerRadius); 
                 float glow = sin(t * 3.1415926); 
                 vec3 fireColor = mix(vec3(3.0, 0.2, 0.0), vec3(3.0, 1.5, 0.2), glow);
                 gl_FragColor.rgb += fireColor * glow * 1.8;
                 gl_FragColor.a *= smoothstep(0.0, 0.5, t); 
               }
             }
           }
          `
        );
      };
    }
  });
  solidWrapper.add(clonedScene); solidWrapper.visible = true; scene.add(solidWrapper);

  return { positions, solidWrapper };
}

function makeDataTexture(data) {
  const tex = new THREE.DataTexture(data, WIDTH, WIDTH, THREE.RGBAFormat, THREE.FloatType);
  tex.needsUpdate = true; tex.minFilter = THREE.NearestFilter; tex.magFilter = THREE.NearestFilter; return tex;
}

const velocityFragmentShader = `
  precision highp float; 
  uniform float uTime; uniform float uDelta; uniform float uGather; uniform float uExplosion; 
  uniform vec3 uMousePos; uniform vec3 uMouseVel; uniform float uMouseActive; uniform float uLeakRadius;
  uniform sampler2D uTargetA; uniform sampler2D uTargetB; uniform float uTransition; 
  uniform sampler2D uTextureTrail;

  vec3 hash33(vec3 p3) { p3 = fract(p3 * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz+33.33); return fract((p3.xxy + p3.yxx)*p3.zyx); }

  void main() { 
    vec2 uv = gl_FragCoord.xy / resolution.xy; 
    vec3 pos = texture2D(texturePosition, uv).xyz; 
    vec3 vel = texture2D(textureVelocity, uv).xyz; 
    vec3 target = mix(texture2D(uTargetA, uv).xyz, texture2D(uTargetB, uv).xyz, uTransition); 
    float trail = texture2D(uTextureTrail, uv).r;
    
    float distToMouse = length(pos - uMousePos);
    float activeLeakRadius = max(uLeakRadius, 0.8); 
    float isLeaking = (uMouseActive > 0.0 && distToMouse < activeLeakRadius) ? 1.0 : 0.0;
    
    float leakState = max(isLeaking, smoothstep(0.3, 0.8, trail) * 0.95);
    if (uTransition < 1.0) leakState = 0.0; 
    
    float structureStrength = uGather * (1.0 - uExplosion) * (1.0 - leakState);
    
    vec3 toTarget = target - pos;
    vec3 springForce = toTarget * 28.0 * structureStrength;
    
    vec3 orbitDir = normalize(cross(pos, vec3(0.0, 1.0, 0.0)) + vec3(0.001));
    vec3 orbitForce = orbitDir * 25.0 * (1.0 - uGather);
    
    vec3 explodeForce = vec3(0.0);
    if (uExplosion > 0.0) { 
      vec3 randDir = hash33(pos * 10.0) * 2.0 - 1.0;
      explodeForce = normalize(pos + randDir) * 75.0 * uExplosion / (length(pos) + 0.1); 
    } 
    
    vec3 sparkForce = vec3(0.0);
    if(isLeaking > 0.0) {
      vec3 outwardDir = normalize(pos - uMousePos + hash33(pos * 5.0) * 0.5);
      float strength = (1.0 - distToMouse / activeLeakRadius);
      sparkForce = outwardDir * 35.0 * strength + vec3(0.0, 3.0, 0.0) + uMouseVel * 0.15;
    }
    
    float freeFactor = 1.0 - structureStrength;
    vec3 gravity = vec3(0.0, -8.0, 0.0) * freeFactor;
    
    vel += (springForce + orbitForce + explodeForce + sparkForce + gravity) * uDelta; 
    vel *= mix(0.98, 0.72, structureStrength);

    if (length(vel) > 40.0) vel = normalize(vel) * 40.0; 
    gl_FragColor = vec4(vel, 1.0); 
  }
`;

const positionFragmentShader = `precision highp float; uniform float uDelta; void main() { vec2 uv = gl_FragCoord.xy / resolution.xy; gl_FragColor = vec4(texture2D(texturePosition, uv).xyz + texture2D(textureVelocity, uv).xyz * uDelta, 1.0); }`;
const trailFragmentShader = `precision highp float; uniform float uDelta; void main() { vec2 uv = gl_FragCoord.xy / resolution.xy; float trail = texture2D(textureTrail, uv).r * pow(0.85, uDelta * 60.0); float speed = length(texture2D(textureVelocity, uv).xyz); float speedTrail = smoothstep(1.5, 12.0, speed) * uDelta * 3.0; gl_FragColor = vec4(clamp(trail + speedTrail, 0.0, 1.2), 0.0, 0.0, 1.0); }`;

const particleVertexShader = `
  precision highp float; uniform sampler2D uTexturePosition; uniform sampler2D uTextureVelocity; uniform sampler2D uTextureTrail; 
  uniform float uPixelRatio; uniform float uRefDist; attribute vec2 reference; attribute float aRandom; 
  varying float vSpeed; varying float vTrail; varying vec3 vPos; varying float vRandom;
  void main() { 
    vec3 pos = texture2D(uTexturePosition, reference).xyz; vec3 vel = texture2D(uTextureVelocity, reference).xyz; 
    float trail = texture2D(uTextureTrail, reference).r; float speed = length(vel); 
    vSpeed = speed; vTrail = trail; vPos = pos; vRandom = aRandom; 
    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0); gl_Position = projectionMatrix * mvPosition; 
    float depthScale = clamp(uRefDist / max(-mvPosition.z, 0.1), 0.4, 2.5); 
    float baseSize = (1.5 + trail * 2.5) * (1.0 / (1.0 + speed * 0.03)); 
    gl_PointSize = clamp(baseSize * uPixelRatio * depthScale * (16.0 / max(-mvPosition.z, 0.1)), 0.5, 6.0); 
  }
`;

const particleFragmentShader = `
  precision highp float; 
  uniform float uGather; uniform float uStateBlend; 
  varying float vSpeed; varying float vTrail; varying vec3 vPos; varying float vRandom; 
  vec3 hsv2rgb(vec3 c) { vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0); vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www); return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y); }
  
  void main() { 
    vec2 p = gl_PointCoord * 2.0 - 1.0; float r2 = dot(p, p); 
    if (r2 > 1.0) discard; 
    float soft = 1.0 - smoothstep(0.05, 1.0, r2); 
    float cosmicGlow = (1.0 - uGather); 
    
    float activeMask = clamp((vSpeed - 1.0) * 0.8 + vTrail * 1.5, 0.0, 1.0);
    activeMask *= pow(uGather, 6.0); 

    float hueOriginal = mix(0.12, 0.45, step(0.5, fract(vRandom * 17.37)));
    float sparkHue = 0.05 + fract(vRandom * 10.0) * 0.05; 
    float baseHue = mix(hueOriginal, sparkHue, uStateBlend * activeMask);
    
    float sat = 1.0 - smoothstep(5.0, 15.0, vSpeed) - cosmicGlow * 0.5;
    float val = 0.2 + smoothstep(2.0, 10.0, vSpeed) * 0.8 + vTrail * 0.5 + cosmicGlow * 1.2;
    vec3 colorRGB = hsv2rgb(vec3(baseHue, sat, val));
    
    float baseAlpha = soft * (0.1 + vTrail * 0.6 + vSpeed * 0.1 + cosmicGlow * 0.3); 
    float finalAlpha = baseAlpha * mix(1.0, activeMask, uStateBlend);
    if (finalAlpha < 0.03) discard; 
    
    gl_FragColor = vec4(colorRGB, clamp(finalAlpha, 0.0, 0.9)); 
  }
`;

let gpuCompute, positionVariable, velocityVariable, trailVariable, particleMaterial, points, targetA, targetB;
let gpuAvailable = false;
let gpuInitializing = true;

function easeInOut(t) {
  t = Math.max(0, Math.min(1, t));
  return t * t * (3 - 2 * t);
}

function setViewMode(mode) {
  if (mode === 'particle') {
    if (gpuInitializing) {
      showErr('Particle engine is still initializing.');
      return;
    }
    if (!gpuAvailable) {
      useSolidFallback('Particle mode is unavailable on this device; solid mode remains active.');
      return;
    }
    viewMode = 'particle';
    targetStateBlend = 0.0;
    explosion = Math.max(explosion, 0.22);
  } else {
    viewMode = 'solid';
    targetStateBlend = 1.0;
    explosion = 0.0;
  }
  updateBtnStates();
}

function useSolidFallback(reason = '') {
  gpuAvailable = false;
  gpuInitializing = false;
  setViewMode('solid');
  if (reason) showErr(reason);
}

function disposeParticleEngine() {
  if (points) {
    scene.remove(points);
    points.geometry?.dispose?.();
    points.material?.dispose?.();
  }
  [targetA, targetB].forEach(texture => texture?.dispose?.());
  [positionVariable, velocityVariable, trailVariable].forEach(variable => {
    variable?.renderTargets?.forEach(target => target.dispose?.());
    variable?.initialValueTexture?.dispose?.();
  });
  gpuCompute = null;
  positionVariable = null;
  velocityVariable = null;
  trailVariable = null;
  particleMaterial = null;
  points = null;
  targetA = null;
  targetB = null;
}

function initGPU() {
  if (!modelTargets[0]) throw new Error('Initial model target is not ready');
  disposeParticleEngine();
  gpuCompute = new GPUComputationRenderer(WIDTH, WIDTH, renderer);
  if (renderer.capabilities.isWebGL2) gpuCompute.setDataType(THREE.FloatType);

  const pos0 = gpuCompute.createTexture();
  for (let i = 0; i < COUNT; i++) {
    const r = 20.0 + Math.random() * 40.0, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos0.image.data[i*4] = r * Math.sin(ph) * Math.cos(th); pos0.image.data[i*4+1] = r * Math.cos(ph); pos0.image.data[i*4+2] = r * Math.sin(ph) * Math.sin(th); pos0.image.data[i*4+3] = 1;
  }
  const vel0 = gpuCompute.createTexture(); vel0.image.data.fill(0);
  const trail0 = gpuCompute.createTexture(); trail0.image.data.fill(0);

  targetA = makeDataTexture(new Float32Array(COUNT * 4)); targetB = makeDataTexture(new Float32Array(COUNT * 4));
  writeTargetTexture(targetA, modelTargets[0].positions); writeTargetTexture(targetB, modelTargets[0].positions);

  positionVariable = gpuCompute.addVariable('texturePosition', positionFragmentShader, pos0);
  velocityVariable = gpuCompute.addVariable('textureVelocity', velocityFragmentShader, vel0);
  trailVariable = gpuCompute.addVariable('textureTrail', trailFragmentShader, trail0);

  gpuCompute.setVariableDependencies(positionVariable, [positionVariable, velocityVariable]);
  gpuCompute.setVariableDependencies(velocityVariable, [positionVariable, velocityVariable, trailVariable]);
  gpuCompute.setVariableDependencies(trailVariable, [positionVariable, velocityVariable, trailVariable]);

  velocityVariable.material.uniforms = { 
    uTime:{value:0}, uDelta:{value:0.016}, uGather:{value:0.78}, uExplosion:{value:0}, 
    uMousePos:{value:new THREE.Vector3()}, uMouseVel:{value:new THREE.Vector3()}, uMouseActive:{value:0}, uLeakRadius:{value:0},
    uTargetA:{value:targetA}, uTargetB:{value:targetB}, uTransition:{value:1}, uTextureTrail:{value:null}
  };
  positionVariable.material.uniforms = { uDelta:{value:0.016} };
  trailVariable.material.uniforms = { uDelta:{value:0.016} };

  const gpuError = gpuCompute.init();
  if (gpuError) throw new Error(gpuError);

  const geometry = new THREE.BufferGeometry();
  const refs = new Float32Array(COUNT * 2), randoms = new Float32Array(COUNT);
  for (let i = 0; i < COUNT; i++) { refs[i*2] = (i%WIDTH)/WIDTH; refs[i*2+1] = Math.floor(i/WIDTH)/WIDTH; randoms[i] = Math.random(); }
  geometry.setAttribute('reference', new THREE.BufferAttribute(refs, 2)); geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1)); geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(COUNT * 3), 3));

  particleMaterial = new THREE.ShaderMaterial({
    uniforms: { 
      uTexturePosition:{value:null}, uTextureVelocity:{value:null}, uTextureTrail:{value:null}, 
      uPixelRatio:{value:PIXEL_RATIO}, uRefDist:{value:REF_DIST}, uGather:{value:0.78}, uStateBlend:{value:0.0} 
    },
    vertexShader: particleVertexShader, fragmentShader: particleFragmentShader,
    transparent: true, depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending,
  });
  points = new THREE.Points(geometry, particleMaterial); scene.add(points);
}

function writeTargetTexture(tex, positions) {
  const data = tex.image.data;
  for (let i = 0; i < COUNT; i++) { data[i*4] = positions[i*3]; data[i*4+1] = positions[i*3+1]; data[i*4+2] = positions[i*3+2]; data[i*4+3] = 1; }
  tex.needsUpdate = true;
}

function disposeObject3D(root) {
  if (!root) return;
  root.traverse(child => {
    if (!child.isMesh) return;
    child.geometry?.dispose?.();
    const materials = Array.isArray(child.material) ? child.material : [child.material];
    materials.forEach(material => {
      if (!material) return;
      Object.values(material).forEach(value => value?.isTexture && value.dispose());
      material.dispose?.();
    });
  });
}

function evictUnusedModels() {
  const loaded = modelTargets.reduce((total, target) => total + (target ? 1 : 0), 0);
  if (loaded <= MODEL_CACHE_LIMIT) return;
  const candidates = modelTargets
    .map((target, index) => ({ index, target, used: modelLastUsed.get(index) || 0 }))
    .filter(item => item.target && item.index !== currentIndex && item.index !== prevIndex)
    .sort((a, b) => a.used - b.used);
  while (modelTargets.reduce((total, target) => total + (target ? 1 : 0), 0) > MODEL_CACHE_LIMIT && candidates.length) {
    const { index } = candidates.shift();
    scene.remove(solidModels[index]);
    disposeObject3D(solidModels[index]);
    solidModels[index] = null;
    modelTargets[index] = null;
    modelLastUsed.delete(index);
  }
}

async function loadModel(index) {
  if (modelTargets[index]) {
    modelLastUsed.set(index, performance.now());
    return true;
  }
  if (modelLoading.has(index)) return modelLoading.get(index);

  const promise = (async () => {
    setAssetStatus(`Loading model ${index + 1}/${MODEL_URLS.length}…`);
    const url = MODEL_URLS[index];
    const cacheKey = `${PARTICLE_CACHE_VERSION}:${COUNT}:${url}`;
    const cachedPositionsPromise = readParticleCache(cacheKey);
    const gltfPromise = modelLoader.loadAsync(url);
    const [gltf, cachedPositions] = await Promise.all([
      Promise.race([
        gltfPromise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('Model loading timed out')), 45000))
      ]),
      cachedPositionsPromise
    ]);
    const result = processModel(gltf.scene, COUNT, cachedPositions);
    modelTargets[index] = { positions: result.positions };
    solidModels[index] = result.solidWrapper;
    modelLastUsed.set(index, performance.now());
    if (!cachedPositions) await writeParticleCache(cacheKey, result.positions);
    evictUnusedModels();
    setAssetStatus(`Model ${index + 1}/${MODEL_URLS.length} ready`, 'ready');
    return true;
  })().catch(error => {
    showErr(`${DICT[lang].loading_err}: ${error.message}`);
    setAssetStatus(`Model ${index + 1} failed to load`, 'error');
    return false;
  }).finally(() => modelLoading.delete(index));

  modelLoading.set(index, promise);
  return promise;
}

async function load() {
  updateBtnStates(); updateUI(0); setAssetStatus('Loading exhibition data…');
  try {
    const res = await fetch(JSON_URL);
    artifacts = await res.json(); if (!Array.isArray(artifacts)) artifacts = [];
  } catch (e) { showErr(e.message); artifacts = []; }

  const firstModelLoaded = await loadModel(0);
  if (!firstModelLoaded) modelTargets[0] = { positions: new Float32Array(COUNT * 3) };

  await new Promise(r => setTimeout(r, 20));
  // Show the model first. GPU particle setup can be expensive on Safari and
  // lower-end devices, so it must never block the initial interactive view.
  hideLoading(); updateUI(0); startAnimation();

  setTimeout(() => {
    try {
      initGPU();
      gpuAvailable = true;
      gpuInitializing = false;
      setAssetStatus(`Interactive scene ready · ${COUNT.toLocaleString()} particles`, 'ready');
    } catch (e) {
      gpuInitializing = false;
      useSolidFallback('Particle mode unavailable; solid model remains active. ' + e.message);
    }
  }, 0);

}

async function switchTo(index) {
  if (index === currentIndex) return;
  const loaded = await loadModel(index);
  if (!loaded || !modelTargets[index]) return;
  prevIndex = currentIndex;
  currentIndex = index;
  modelLastUsed.set(index, performance.now());
  transition = 0;
  explosion = Math.max(explosion, 0.12);
  updateUI(index);

  if (!gpuAvailable) {
    return;
  }
  if (!targetA || !targetB) return;
  targetA.image.data.set(targetB.image.data);
  writeTargetTexture(targetB, modelTargets[index].positions);
  evictUnusedModels();
}

// ============================================================
// Event Listeners (Mouse only active in mouse mode)
// ============================================================
const raycaster = new THREE.Raycaster(); const mousePlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
addEventListener('pointerdown', e => { 
  if (inputMode === 'gesture' || e.target.tagName === 'BUTTON') return;
  isDragging = true; hasDragged = false; lastX = e.clientX; lastY = e.clientY;
});
addEventListener('pointermove', e => { 
  if (inputMode === 'gesture') return;
  mouse.x = (e.clientX / innerWidth) * 2 - 1; mouse.y = -(e.clientY / innerHeight) * 2 + 1; mouseForceActive = 1.0;
  if(isDragging) {
    hasDragged = true; userRotY += (e.clientX - lastX) * 0.006; userRotX += (e.clientY - lastY) * 0.006;
    userRotX = Math.max(-0.8, Math.min(0.8, userRotX)); lastX = e.clientX; lastY = e.clientY;
  }
});
addEventListener('pointerup', e => { 
  if (inputMode === 'gesture') return;
  if(isDragging && !hasDragged) explosion = 1.0; 
  isDragging = false; 
});
addEventListener('pointerleave', () => { if(inputMode === 'mouse'){ mouseForceActive = 0.0; isDragging = false; }});
addEventListener('wheel', e => { if(inputMode === 'mouse'){ e.preventDefault(); camera.position.z = Math.max(4.5, Math.min(18, camera.position.z + e.deltaY * 0.01)); }}, { passive: false });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); switchTo((currentIndex + 1) % MODEL_URLS.length); }});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
document.addEventListener('visibilitychange', () => {
  pageVisible = !document.hidden;
  if (video.srcObject) video.srcObject.getTracks().forEach(track => { track.enabled = pageVisible; });
  if (!pageVisible) {
    lastVideoTime = -1;
    mouseForceActive = 0;
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    animationFrameId = 0;
  } else {
    startAnimation();
  }
});

// ============================================================
// Render Loop
// ============================================================
function startAnimation() {
  if (!animationStarted) animationStarted = true;
  requestNextFrame();
}

function requestNextFrame() {
  if (pageVisible && !animationFrameId) animationFrameId = requestAnimationFrame(animate);
}

function animate() {
  animationFrameId = 0;
  if (!pageVisible) return;
  try {
    animateFrame();
  } catch (e) {
    if (gpuAvailable) {
      useSolidFallback('Particle rendering stopped; switched to solid model. ' + e.message);
    } else {
      showErr('Rendering error: ' + e.message);
    }
  }
  requestNextFrame();
}

function animateFrame() {
  const dt = Math.min(clock.getDelta(), 0.03); const t = clock.elapsedTime;
  
  if (inputMode === 'gesture') processHands(t, dt);

  raycaster.setFromCamera(mouse, camera); 
  let activeModel = solidModels[currentIndex];
  let hit = false;
  if (activeModel && activeModel.visible) {
      let intersects = raycaster.intersectObject(activeModel, true);
      if (intersects.length > 0) {
          currentMousePos.copy(intersects[0].point);
          hit = true;
      }
  }
  if (!hit) raycaster.ray.intersectPlane(mousePlane, currentMousePos);

  if (mouseForceActive > 0) {
    mouseVelocity.subVectors(currentMousePos, prevMousePos).divideScalar(dt);
    if(mouseVelocity.length() > 50.0) mouseVelocity.normalize().multiplyScalar(50.0); 
  } else { mouseVelocity.set(0,0,0); }
  prevMousePos.copy(currentMousePos);

  if (points) {
    const inverseMatrix = new THREE.Matrix4().copy(points.matrixWorld).invert();
    localMousePos.copy(currentMousePos).applyMatrix4(inverseMatrix);
  }
  
  if (inputMode === 'gesture' && mouseForceActive > 0) {
      cursorGroup.visible = true;
      cursorGroup.position.copy(currentMousePos);
      cursorGroup.quaternion.copy(camera.quaternion); 
      cursorRing.rotation.z -= dt * 3.0; 
      let pulse = 1.0 + Math.sin(t * 8.0) * 0.15;
      cursorRing.scale.set(pulse, pulse, pulse);
      cursorRing.material.color.setHex(isPinching ? 0xff3333 : 0xd8b56a);
  } else {
      cursorGroup.visible = false;
  }

  stateBlend += (targetStateBlend - stateBlend) * Math.min(1, dt * 4.5);
  
  let targetLeakRadius = (targetStateBlend > 0.5 && mouseForceActive > 0) ? 0.8 : 0.0;
  currentLeakRadius += (targetLeakRadius - currentLeakRadius) * dt * 8.0; 

  if (transition < 1) transition = Math.min(1, transition + dt / MODEL_TRANSITION_SECONDS);
  if (explosion > 0) explosion = Math.max(0, explosion - dt * 4.0);
  const transitionMix = easeInOut(transition);
  const gather = transitionMix;

  if (gpuAvailable) {
    velocityVariable.material.uniforms.uTextureTrail.value = gpuCompute.getCurrentRenderTarget(trailVariable).texture;
    velocityVariable.material.uniforms.uDelta.value = dt;
    velocityVariable.material.uniforms.uTime.value = t;
    velocityVariable.material.uniforms.uGather.value = gather;
    velocityVariable.material.uniforms.uExplosion.value = explosion;
    velocityVariable.material.uniforms.uTransition.value = transitionMix;
    velocityVariable.material.uniforms.uMousePos.value.copy(localMousePos);
    velocityVariable.material.uniforms.uMouseVel.value.copy(mouseVelocity);
    velocityVariable.material.uniforms.uMouseActive.value = mouseForceActive;
    velocityVariable.material.uniforms.uLeakRadius.value = currentLeakRadius;

    trailVariable.material.uniforms.uDelta.value = dt;
    gpuCompute.compute();

    particleMaterial.uniforms.uTexturePosition.value = gpuCompute.getCurrentRenderTarget(positionVariable).texture;
    particleMaterial.uniforms.uTextureVelocity.value = gpuCompute.getCurrentRenderTarget(velocityVariable).texture;
    particleMaterial.uniforms.uTextureTrail.value = gpuCompute.getCurrentRenderTarget(trailVariable).texture;
    particleMaterial.uniforms.uGather.value = gather;
    particleMaterial.uniforms.uStateBlend.value = stateBlend;
  }

  bloomPass.strength = 0.4 + explosion * 0.15;
  autoRotateAngle += 0.002 * (isDragging ? 0 : 1);
  const curRotY = autoRotateAngle + userRotY; const curRotX = userRotX;

  if (points) { points.rotation.y = curRotY; points.rotation.x = curRotX; }
  
  solidModels.forEach((m, i) => {
    if (m) { 
      let tAlpha = 0.0;
      if (i === currentIndex) tAlpha = transitionMix;
      else if (i === prevIndex) tAlpha = 1.0 - transitionMix;
      else tAlpha = 0.0;
      
      m.visible = (tAlpha > 0.01 && stateBlend > 0.01);
      if (m.visible) {
         m.rotation.y = curRotY; m.rotation.x = curRotX;
         m.traverse(child => {
           if (child.isMesh && child.material.userData.shader) {
             child.material.userData.shader.uniforms.uMousePos.value.copy(currentMousePos);
             child.material.userData.shader.uniforms.uLeakRadius.value = currentLeakRadius;
             child.material.userData.shader.uniforms.uStateBlend.value = stateBlend;
             child.material.userData.shader.uniforms.uTransitionAlpha.value = tAlpha;
           }
         });
      }
    }
  });

  composer.render();
}

// Start the interface immediately. The model and its particle target continue
// loading in the background, so MediaPipe is not blocked by the GLB download.
window.__bronzeWareBooted = true;
hideLoading();
updateUI(0);
startAnimation();
load();
</script>
</body>
</html>
